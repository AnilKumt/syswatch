# syswatch Configuration File

# Refresh interval for continuous monitoring (seconds)
interval: 2.0

# Alert threshold percentages (0.0 to 100.0)
thresholds:
  cpu_warning: 80.0
  cpu_critical: 90.0
  memory_warning: 80.0
  memory_critical: 90.0
  swap_warning: 70.0
  swap_critical: 85.0
  disk_warning: 85.0
  disk_critical: 95.0

# Filesystem paths to monitor for disk usage
disk:
  paths:
    - /
    - /home

# Network monitoring toggle
network:
  enabled: true

# Process monitoring configuration
processes:
  enabled: true
  top_n: 10
